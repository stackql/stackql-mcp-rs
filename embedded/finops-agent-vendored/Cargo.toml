[package]
name = "finops-agent-vendored"
version = "0.1.0"
description = "FinOps analyst agent: GPT-5 + the StackQL MCP server vendored straight into the binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
stackql-mcp = { workspace = true, features = ["vendored"] }
rig = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
chrono = "0.4"

# The build script fetches (and sha256-verifies) the platform bundle once so
# include_bundle!() has something to embed. Network at build time, never at
# run time.
[build-dependencies]
stackql-mcp = { workspace = true, features = ["sidecar"] }
