# Act 3 workspace: the smallest possible embedding (minimal), the same thing
# vendored (minimal-vendored), the golden-path agent (steward), and the two
# reference apps that shipped with the crate (auditron, stackql-agent).
[workspace]
resolver = "2"
members = ["minimal", "minimal-vendored", "steward", "auditron", "stackql-agent"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
# Version-locked to the stackql release it embeds; pin the minor.
stackql-mcp = "0.10"
rmcp = { version = "1.7", default-features = false, features = ["client", "transport-async-rw"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"


[profile.release]
strip = true
lto = "thin"
codegen-units = 1
